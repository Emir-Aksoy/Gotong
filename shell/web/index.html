<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 与 hub 同姿态的 CSP:script-src 'self' 无 inline —— export 门对此有断言。
       connect-src * 是诚实的:壳的存在意义就是连成员自己选的 hub;「明文 http 只在
       回环」这条规矩由 hub-target 的 normalizeHubBase 一处咽喉裁决,不靠 CSP。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src *; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <!-- POLISH-M3:theme-color 跟系统明暗走(与 shell.css 的 --shell-bg 同值),
       状态栏区不再永远压深色。 -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161615">
  <title>Gotong</title>
  <link rel="stylesheet" href="sdui-ui.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- 配对屏:公开 claim 换 aipk_ 设备凭证。宿主元素刻意不叫 #sdui-panel ——
       与 sdui-standalone 同一手法,面板只可能来自 shell.js 那次显式 mount()。 -->
  <main id="screen-pair" hidden>
    <section class="pair-card">
      <h1 class="pair-title">Gotong</h1>
      <p class="pair-lead" data-s="lead"></p>
      <label class="pair-field">
        <span data-s="addrLabel"></span>
        <input id="pair-addr" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://hub.example.com">
      </label>
      <label class="pair-field">
        <span data-s="codeLabel"></span>
        <input id="pair-code" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD-EFGH-JKMN-PQRS">
      </label>
      <button id="pair-btn" type="button" data-s="connect"></button>
      <p id="pair-err" class="pair-err" role="alert" aria-live="polite"></p>
    </section>
  </main>

  <main id="screen-panel" hidden>
    <header class="shell-bar">
      <span id="conn-info" class="conn-info"></span>
      <span class="shell-bar-btns">
        <button id="refresh-btn" type="button" data-s="refresh"></button>
        <button id="lang-btn" type="button">EN</button>
        <button id="disconnect-btn" type="button" data-s="disconnect"></button>
      </span>
    </header>
    <!-- SHELL-M6:通知行。只在「原生平台 + hub 真开了 APNs」时由 shell.js 显示;
         绝不在启动时自动弹权限——开启是成员按按钮的动作。 -->
    <div id="notify-row" class="notify-row" hidden>
      <span id="notify-state" class="notify-state"></span>
      <button id="notify-btn" type="button"></button>
    </div>
    <!-- POLISH-M3:下拉刷新指示条。纯提示层(pointer-events:none),手势与
         触发都在 shell.js;加载反馈交棒给渲染器的骨架屏。 -->
    <div id="pull-hint" class="pull-hint" hidden aria-hidden="true"><span id="pull-hint-text" class="pull-hint-pill"></span></div>
    <div id="shell-host"></div>
    <p id="panel-note" class="shell-note" role="status" hidden></p>
  </main>

  <script src="hub-target.js"></script>
  <script src="sdui-ui.js"></script>
  <script src="shell.js"></script>
</body>
</html>
