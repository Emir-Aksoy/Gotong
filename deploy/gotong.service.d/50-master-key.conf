# ── Gotong master key drop-in 模板 ·「挪出数据盘」（云端关键）──
#
# 为什么：云盘会被快照、可能被盗。把凭证库主密钥（KEK）从数据盘挪到
# systemd 注入的环境里，盘的镜像里就**不含密钥**。
# 完整说明：docs/zh/GO-LIVE.md「T2/T3.2 master key 挪出数据盘」。
#
# 用法（VPS 上）：
#   openssl rand -hex 32             # 生成一次，64 hex —— 只生成一次！
#   sudo mkdir -p /etc/systemd/system/gotong.service.d
#   sudo cp deploy/gotong.service.d/50-master-key.conf \
#           /etc/systemd/system/gotong.service.d/50-master-key.conf
#   sudo $EDITOR /etc/systemd/system/gotong.service.d/50-master-key.conf   # 填真 key
#   sudo chmod 600 /etc/systemd/system/gotong.service.d/50-master-key.conf # root 专读
#   sudo systemctl daemon-reload && sudo systemctl restart gotong
#
# ★ 纪律（缺一不可）★
#   - 真 key 只进这个 root 专读的 drop-in，**别**写进 /etc/gotong.env 明文
#     （那份 640 归 gotong:gotong，读面更宽），**别**提交进 git。
#   - 丢了这个 key = 解不开 vault ——【单独离线备份它】，跟数据备份分开放。
#   - 想更进一步不落任何盘：改用 `systemd-creds encrypt` + LoadCredential=，
#     见 GO-LIVE.md 同节；本模板是它的直白版（Environment= 注入）。

[Service]
Environment=GOTONG_MASTER_KEY_PROVIDER=env
# 把 <这里换成 openssl rand -hex 32 的输出> 整段替换成 64 位 hex：
Environment=GOTONG_MASTER_KEY=<这里换成 openssl rand -hex 32 的输出>
